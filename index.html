<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifePath TH</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071126;color:#f2f6ff;font:14px system-ui,sans-serif;padding-bottom:80px}
button,input,select{font:inherit}
button{color:white;background:#142447;border:1px solid #293d65;border-radius:12px;padding:11px;cursor:pointer}
button:active{transform:scale(.98)}
.wrap{max-width:760px;margin:auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 2px}
.logo{font-size:24px;font-weight:900}.logo b{color:#a8aaff}
.sub,small{color:#9eafd0;font-size:11px}
.hero{padding:20px;border-radius:20px;background:linear-gradient(125deg,#172b5c,#65488e,#ee8db3);min-height:140px}
.hero h1{margin:0;font-size:24px}
.profile,.card,.stat,.action{border:1px solid #293d65;border-radius:15px;background:linear-gradient(145deg,#102143,#0a1730)}
.profile{display:flex;align-items:center;gap:12px;margin-top:12px;padding:13px}
.face{font-size:34px;background:#344f86;padding:12px;border-radius:14px}
.name{font-size:17px;font-weight:800}
.cash{margin-left:auto;color:#27d6a0;font-weight:bold;text-align:right}
.stats,.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.stat{padding:11px}.stathead{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}
.bar{height:7px;background:#263657;border-radius:8px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#516bff,#24d9b0)}
.section{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}
.section h2{font-size:16px;margin:0}
.action{text-align:left;min-height:90px;padding:13px}
.action strong,.action small{display:block;margin-top:6px}
.emoji{font-size:24px}
.card{padding:13px;margin:10px 0}
.primary{width:100%;background:linear-gradient(100deg,#526cff,#a04fff);border:0;font-weight:bold}
.danger{background:#b82d55}
.page{display:none}.page.active{display:block}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #26385a}
.row:last-child{border:0}.grow{flex:1;min-width:0}
.row small{display:block;margin-top:4px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#08132af5;border-top:1px solid #26385b;padding:7px 3px}
.tab{border:0;background:transparent;color:#9caecc;font-size:10px;padding:5px 0}
.tab span{display:block;font-size:19px;margin-bottom:3px}
.tab.active{color:#c7b4ff;background:#1c2d53}
label{display:block;color:#9eafd0;margin:10px 0}
input,select{width:100%;padding:11px;background:#07142d;color:white;border:1px solid #31466f;border-radius:10px;margin-top:5px}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main class="wrap">
<header><div><div class="logo">LifePath <b>TH</b></div><div class="sub">ชีวิตจำลอง · ทุกการเลือกมีผล</div></div><button onclick="page('settings')">⚙️</button></header>
<div class="hero"><h1>เส้นทางชีวิตของคุณ</h1><p>เติบโต สร้างความสัมพันธ์ และทำความฝันให้สำเร็จ</p><div id="yearLabel"></div></div>
<div class="profile"><div class="face" id="face">🧑🏻</div><div><div class="name" id="pname">P9D</div><div class="sub" id="bio"></div><small id="jobpill"></small></div><div class="cash" id="cash"></div></div>
<div class="stats" id="stats"></div>

<section class="page active" id="home">
<div class="section"><h2>⚡ กิจกรรมชีวิต</h2><small id="energyLabel"></small></div>
<div class="grid">
<button class="action" onclick="act('read')"><span class="emoji">📚</span><strong>อ่านหนังสือ</strong><small>สติปัญญา +5</small></button>
<button class="action" onclick="act('exercise')"><span class="emoji">🏃</span><strong>ออกกำลังกาย</strong><small>สุขภาพ +6</small></button>
<button class="action" onclick="act('game')"><span class="emoji">🎮</span><strong>เล่นเกม</strong><small>ความสุข +7</small></button>
<button class="action" onclick="act('work')"><span class="emoji">💼</span><strong>ทำงานพิเศษ</strong><small>ได้เงิน</small></button>
<button class="action" onclick="act('social')"><span class="emoji">🫂</span><strong>พบปะผู้คน</strong><small>เพิ่มความสัมพันธ์</small></button>
<button class="action" onclick="act('hobby')"><span class="emoji">🎸</span><strong>ฝึกทักษะ</strong><small>สุข +4 · ฉลาด +2</small></button>
</div>
<div class="section"><h2>📖 บันทึกชีวิต</h2></div><div class="card" id="logs"></div>
<button class="primary" onclick="nextYear()">⏭️ ก้าวสู่ปีถัดไป</button>
</section>

<section class="page" id="relationships">
<div class="section"><h2>💗 ความสัมพันธ์</h2><button onclick="meet()">＋ พบคนใหม่</button></div><div id="people"></div>
</section>

<section class="page" id="career">
<div class="section"><h2>🎓 เรียน / อาชีพ</h2></div>
<div class="card"><h2 id="careerTitle"></h2><p id="salaryText"></p><button class="primary" onclick="promote()">ขอเลื่อนตำแหน่ง</button></div>
<div id="jobs"></div><div class="card"><h3 id="eduTitle"></h3><p id="eduProgress"></p><button class="primary" onclick="studyMore()">เรียนต่อ ฿5,000</button></div>
</section>

<section class="page" id="finance">
<div class="section"><h2>💰 การเงินและธนาคาร</h2></div>
<div class="card"><p id="fCash"></p><p id="fSave"></p><p id="fWorth"></p><label>จำนวนเงิน<input id="amount" type="number" value="1000"></label><div class="grid"><button onclick="bank(true)">ฝากเงิน</button><button onclick="bank(false)">ถอนเงิน</button></div></div>
</section>

<section class="page" id="assets"><div class="section"><h2>🏡 ทรัพย์สิน</h2></div><div id="owned"></div><div id="shop"></div></section>

<section class="page" id="settings">
<div class="section"><h2>⚙️ ตั้งค่า</h2></div>
<div class="card"><label>ชื่อตัวละคร<input id="nameInput" maxlength="24"></label><label>อวาตาร์<select id="faceInput"><option>🧑🏻</option><option>👩🏻</option><option>🧑🏽</option><option>👨🏻‍🎤</option></select></label><button class="primary" onclick="saveProfile()">บันทึกโปรไฟล์</button></div>
<div class="card"><button onclick="exportSave()">ส่งออกเซฟ</button> <button onclick="document.getElementById('file').click()">นำเข้าเซฟ</button><input id="file" type="file" accept=".json" hidden onchange="importSave(event)"></div>
<div class="card"><button class="danger" onclick="resetGame()">เริ่มชีวิตใหม่</button></div>
</section>
</main>
<nav class="tabs">
<button class="tab active" data-id="home" onclick="page('home')"><span>🏠</span>หน้าหลัก</button>
<button class="tab" data-id="relationships" onclick="page('relationships')"><span>💗</span>สัมพันธ์</button>
<button class="tab" data-id="career" onclick="page('career')"><span>🎓</span>เรียน/งาน</button>
<button class="tab" data-id="finance" onclick="page('finance')"><span>💰</span>การเงิน</button>
<button class="tab" data-id="assets" onclick="page('assets')"><span>🏡</span>ทรัพย์สิน</button>
</nav>
<script>
const KEY='lifepath_th_v2';
const fresh=()=>({name:'P9D',face:'🧑🏻',age:18,year:2026,health:88,happy:82,intel:65,fame:25,energy:100,cash:12500,savings:0,job:'ว่างงาน',salary:0,edu:'มัธยมศึกษา',eduYears:0,partner:'',people:[{name:'พ่อ',kind:'ครอบครัว',aff:80},{name:'แม่',kind:'ครอบครัว',aff:85},{name:'เพื่อน',kind:'เพื่อน',aff:55}],assets:[],logs:['เริ่มต้นชีวิตใหม่ 🌆']});
let s;try{s={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){s=fresh()}
const fmt=n=>'฿'+Math.round(n).toLocaleString('th-TH'),cap=n=>Math.max(0,Math.min(100,Math.round(n)));
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function note(t){s.logs.unshift('อายุ '+s.age+' ปี · '+t);s.logs=s.logs.slice(0,8)}
function page(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.id===id));render()}
function act(t){if(s.energy<15)return alert('พลังงานไม่พอ ก้าวสู่ปีถัดไปเพื่อพัก');s.energy-=15;let log='';if(t==='read'){s.intel=cap(s.intel+5);log='อ่านหนังสือ เพิ่มสติปัญญา'}if(t==='exercise'){s.health=cap(s.health+6);s.happy=cap(s.happy+2);log='ออกกำลังกาย สุขภาพดีขึ้น'}if(t==='game'){s.happy=cap(s.happy+7);log='เล่นเกมคลายเครียด'}if(t==='work'){let n=300+Math.floor(Math.random()*501);s.cash+=n;log='ทำงานพิเศษ ได้เงิน '+fmt(n)}if(t==='social'){s.happy=cap(s.happy+4);s.fame=cap(s.fame+2);s.people[0].aff=cap(s.people[0].aff+2);log='พบปะผู้คน'}if(t==='hobby'){s.intel=cap(s.intel+2);s.happy=cap(s.happy+4);log='ฝึกทักษะใหม่'}note(log);save();render()}
function nextYear(){if(!confirm('ขึ้นปีใหม่? อายุ +1 และพลังงานเต็ม'))return;s.age++;s.year++;s.energy=100;s.cash+=s.salary;s.savings=Math.floor(s.savings*1.02);s.health=cap(s.health-1);note('ขึ้นปี '+s.year+' รับเงินเดือน '+fmt(s.salary));save();render()}
const jobs=[['พนักงานร้านค้า',12000,0,18,0],['พนักงานออฟฟิศ',22000,35,20,0],['นักออกแบบ',32000,50,20,1],['โปรแกรมเมอร์',48000,65,20,2],['แพทย์',70000,80,24,2]];
function level(){return s.edu==='ปริญญาโท'?2:s.edu==='ปริญญาตรี'?1:0}
function applyJob(i){let j=jobs[i];if(s.age<j[3]||s.intel<j[2]||level()<j[4])return alert('คุณสมบัติไม่ครบ');s.job=j[0];s.salary=j[1];note('ได้งาน '+j[0]);save();render();alert('สมัครงานสำเร็จ!')}
function promote(){if(!s.salary)return alert('สมัครงานก่อน');s.salary=Math.round(s.salary*1.15);note('เลื่อนตำแหน่ง รายได้ '+fmt(s.salary));save();render()}
function studyMore(){if(s.cash<5000)return alert('เงินสดไม่พอ');if(s.eduYears>=6)return alert('เรียนจบระดับสูงสุดแล้ว');s.cash-=5000;s.eduYears++;s.intel=cap(s.intel+4);if(s.eduYears>=4)s.edu='ปริญญาตรี';if(s.eduYears>=6)s.edu='ปริญญาโท';note('เรียนต่อปีที่ '+s.eduYears);save();render()}
function meet(){let n=prompt('ชื่อคนที่อยากรู้จัก');if(!n||!n.trim())return;s.people.push({name:n.trim().slice(0,24),kind:'เพื่อน',aff:35});note('รู้จักกับ '+n);save();render()}
function interact(i,a){let p=s.people[i];if(a===0)p.aff=cap(p.aff+8);if(a===1){if(s.cash<500)return alert('เงินไม่พอ');s.cash-=500;p.aff=cap(p.aff+15)}if(a===2){if(p.aff<65)return alert('เพิ่มความสัมพันธ์ให้ถึง 65 ก่อน');if(s.partner)return alert('มีคู่รักแล้ว');s.partner=p.name;p.kind='คนรัก'}note('ทำกิจกรรมกับ '+p.name);save();render()}
function bank(dep){let n=Math.floor(+document.getElementById('amount').value);if(n<=0)return alert('ใส่จำนวนเงินให้ถูกต้อง');if(dep){if(n>s.cash)return alert('เงินสดไม่พอ');s.cash-=n;s.savings+=n}else{if(n>s.savings)return alert('เงินออมไม่พอ');s.savings-=n;s.cash+=n}note(dep?'ฝากเงิน '+fmt(n):'ถอนเงิน '+fmt(n));save();render()}
const products=[['📱','โทรศัพท์',12000],['🏍️','มอเตอร์ไซค์',65000],['🚗','รถยนต์',450000],['🏢','คอนโด',1800000]];
function buy(i){let a=products[i];if(s.cash<a[2])return alert('เงินสดไม่พอ');if(s.assets.some(x=>x.name===a[1]))return alert('มีสิ่งนี้อยู่แล้ว');if(!confirm('ซื้อ'+a[1]+' ราคา '+fmt(a[2])+'?'))return;s.cash-=a[2];s.assets.push({emoji:a[0],name:a[1],price:a[2]});note('ซื้อ'+a[1]);save();render()}
function sell(i){let a=s.assets[i];if(!confirm('ขาย'+a.name+' ได้ '+fmt(a.price*.7)+'?'))return;s.cash+=Math.round(a.price*.7);s.assets.splice(i,1);note('ขาย'+a.name);save();render()}
function saveProfile(){let n=document.getElementById('nameInput').value.trim();if(n)s.name=n;s.face=document.getElementById('faceInput').value;save();render();alert('บันทึกแล้ว')}
function exportSave(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));a.download='lifepath-save.json';a.click();URL.revokeObjectURL(a.href)}
function importSave(e){let r=new FileReader();r.onload=()=>{try{s={...fresh(),...JSON.parse(r.result)};save();render();alert('นำเข้าเซฟสำเร็จ')}catch{alert('ไฟล์ไม่ถูกต้อง')}};if(e.target.files[0])r.readAsText(e.target.files[0])}
function resetGame(){if(!confirm('เริ่มชีวิตใหม่และลบเซฟ?'))return;s=fresh();save();page('home')}
function render(){document.getElementById('face').textContent=s.face;document.getElementById('pname').textContent=s.name;document.getElementById('bio').textContent='อายุ '+s.age+' ปี · '+(s.partner?'คบกับ '+s.partner:'โสด');document.getElementById('jobpill').textContent=s.job;document.getElementById('cash').textContent=fmt(s.cash);document.getElementById('yearLabel').textContent='กรุงเทพมหานคร · ปี '+s.year;document.getElementById('energyLabel').textContent='พลังงาน '+s.energy+'/100';document.getElementById('stats').innerHTML=[['💗','สุขภาพ',s.health],['🙂','ความสุข',s.happy],['🧠','สติปัญญา',s.intel],['⭐','ชื่อเสียง',s.fame]].map(x=>'<div class="stat"><div class="stathead"><span>'+x[0]+' '+x[1]+'</span><b>'+x[2]+'/100</b></div><div class="bar"><div class="fill" style="width:'+x[2]+'%"></div></div></div>').join('');document.getElementById('logs').innerHTML=s.logs.map(x=>'<div>• '+x.replace(/[<>]/g,'')+'</div>').join('');document.getElementById('people').innerHTML=s.people.map((p,i)=>'<div class="card"><div class="row"><div class="grow"><strong>'+p.name+'</strong><small>'+p.kind+' · '+p.aff+'% ความสัมพันธ์</small><div class="bar"><div class="fill" style="width:'+p.aff+'%"></div></div></div></div><div class="grid"><button onclick="interact('+i+',0)">💬 คุย</button><button onclick="interact('+i+',1)">🎁 ของขวัญ</button><button onclick="interact('+i+',2)">💗 ขอคบ</button></div></div>').join('');document.getElementById('careerTitle').textContent=s.job;document.getElementById('salaryText').textContent='รายได้ '+fmt(s.salary)+'/ปี';document.getElementById('eduTitle').textContent=s.edu;document.getElementById('eduProgress').textContent='เรียนแล้ว '+s.eduYears+' ปี';document.getElementById('jobs').innerHTML=jobs.map((j,i)=>'<div class="card row"><div class="grow"><strong>'+j[0]+'</strong><small>'+fmt(j[1])+'/ปี · สติปัญญา '+j[2]+' · อายุ '+j[3]+'+</small></div><button onclick="applyJob('+i+')">สมัคร</button></div>').join('');document.getElementById('fCash').textContent='เงินสด '+fmt(s.cash);document.getElementById('fSave').textContent='เงินออม '+fmt(s.savings);document.getElementById('fWorth').textContent='มูลค่ารวม '+fmt(s.cash+s.savings+s.assets.reduce((n,a)=>n+a.price,0));document.getElementById('owned').innerHTML=s.assets.length?s.assets.map((a,i)=>'<div class="card row"><span>'+a.emoji+'</span><div class="grow"><strong>'+a.name+'</strong><small>'+fmt(a.price)+'</small></div><button onclick="sell('+i+')">ขาย</button></div>').join(''):'<div class="card">ยังไม่มีทรัพย์สิน</div>';document.getElementById('shop').innerHTML=products.map((a,i)=>'<div class="card row"><span>'+a[0]+'</span><div class="grow"><strong>'+a[1]+'</strong><small>'+fmt(a[2])+'</small></div><button onclick="buy('+i+')">ซื้อ</button></div>').join('');document.getElementById('nameInput').value=s.name;document.getElementById('faceInput').value=s.face;save()}
render();
</script></body></html>
